[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=tests/_archive
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (test module interactions)
    e2e: End-to-end tests (test full workflows)
    slow: Slow tests (skip in quick mode)
    smoke: Smoke tests (quick sanity checks)
