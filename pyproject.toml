[project]
name = "zensers"
version = "1.4.1"
description = "Automated Industry Research System"
requires-python = ">=3.10"
dependencies = [
    # Core
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0,<4.0.0",
    # LLM clients
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    # Document processing
    "python-docx>=1.0.0",
    "markdown>=3.5.0",
    "docxtpl>=0.16.7",
    "python-pptx>=0.6.21",
    "reportlab>=4.0.0",
    # Charts
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # CLI
    "typer>=0.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "questionary>=1.10.0",
    # Utilities
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "watchdog>=3.0.0",
    "plyer>=2.1.0",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    # LangChain
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.3.0",
    "tavily-python>=0.5.0",
    # Search
    "duckduckgo-search>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
zensers = "src.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
