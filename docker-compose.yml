version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    env_file:
      - .env
    environment:
      - ZENSERS_ENV=production
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-zensers}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
