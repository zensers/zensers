providers:
  openai:
    name: OpenAI
    description: GPT-4o, GPT-4, GPT-3.5 and other models
    default_endpoint: https://api.openai.com/v1
  deepseek:
    name: DeepSeek
    description: DeepSeek V4 Pro, V4 Flash, Chat, Reasoner
    default_endpoint: https://api.deepseek.com
  kimi:
    name: Kimi (月之暗面)
    description: Kimi K2.7 Code, K2.6, K2.5, Moonshot
    default_endpoint: https://api.moonshot.cn/v1
  zhipu:
    name: 智谱 (GLM)
    description: GLM-4.7, GLM-5.1, GLM-5.2
    default_endpoint: https://open.bigmodel.cn/api/paas/v4
  qwen:
    name: 阿里千问
    description: Qwen-Max, Qwen-Plus, Qwen-Turbo
    default_endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
  volcengine:
    name: 火山引擎
    description: Doubao 系列模型
    # 用户 Ark key 为 coding 计划（仅 coding 端点可用），普通 v3 端点会 404
    default_endpoint: https://ark.cn-beijing.volces.com/api/coding/v3
  xiaomi:
    name: 小米
    description: MiMo 系列模型
    default_endpoint: https://xiaomi.ai/api/v1
  local:
    name: 本地模型 (Ollama)
    description: Ollama, LocalAI and other local deployments
    default_endpoint: http://localhost:11434/v1
  custom:
    name: 自定义
    description: 任何 OpenAI 兼容 API
    default_endpoint: ""

