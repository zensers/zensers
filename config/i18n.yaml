# ============================================================
# Internationalization (i18n) Configuration
# ============================================================
# 
# This file defines language settings and labels for multi-language support.
# The system supports Chinese (zh), English (en), Japanese (ja), and Korean (ko).
# 
# Usage:
#   from src.core.i18n import get_localized_text, set_language, Language
#   set_language(Language.EN)
#   title = get_localized_text({"zh": "Executive Summary", "en": "Executive Summary"})
# 
# ============================================================

# Default language (can be overridden by user preference or request parameter)
default_language: "zh"

# Supported languages
supported_languages:
  - zh  # Chinese (Simplified)
  - en  # English
  - ja  # Japanese
  - ko  # Korean

# Report labels (used by ReportGenerationAgent and templates)
report_labels:
  # Cover page
  research_report:
    zh: "研究报告"
    en: "Research Report"
    ja: "研究報告"
    ko: "연구 보고서"
  publish_date:
    zh: "发布日期"
    en: "Publish Date"
    ja: "公開日"
    ko: "발행일"
  report_type:
    zh: "报告类型"
    en: "Report Type"
    ja: "報告種別"
    ko: "보고서 유형"
  disclaimer:
    zh: "免责声明"
    en: "Disclaimer"
    ja: "免責事項"
    ko: "면책 조항"
  disclaimer_text:
    zh: "本报告基于公开信息编制。报告中的信息或意见不构成任何投资建议。投资者应自行判断并承担投资风险。报告中的推测性描述可能不构成实际结果。本公司/研究团队不保证其准确性。过往业绩不代表未来收益。投资有风险，请谨慎决策。"
    en: "This report is prepared based on public information. The information or opinions in this report do not constitute any investment advice. Investors should make their own judgments and bear investment risks. Speculative descriptions in the report may not constitute actual results. Our company/research team does not guarantee their accuracy. Past performance does not indicate future returns. Investment involves risks, please be cautious."
    ja: "本報告書は公開情報に基づいて作成されています。本報告書の情報または意見は、いかなる投資アドバイスも構成しません。投資家は自己判断を行い、投資リスクを負う必要があります。報告書の推測的記述は実際の結果を構成しない可能性があります。過去のパフォーマンスは将来のリターンを示すものではありません。投資にはリスクがあります。"
    ko: "본 보고서는 공개 정보를 기반으로 작성되었습니다. 본 보고서의 정보나 의견은 어떠한 투자 조언도 구성하지 않습니다. 투자자는 스스로 판단하고 투자 위험을 감수해야 합니다. 과거 성과는 미래 수익을 보장하지 않습니다. 투자에는 위험이 따릅니다."
  
  # Table of contents
  toc:
    zh: "目录"
    en: "Table of Contents"
    ja: "目次"
    ko: "목차"
  
  # Main sections
  exec_summary:
    zh: "执行摘要"
    en: "Executive Summary"
    ja: "エグゼクティブサマリー"
    ko: "요약"
  conclusion:
    zh: "研究结论"
    en: "Conclusion"
    ja: "結論"
    ko: "결론"
  appendix:
    zh: "附录"
    en: "Appendix"
    ja: "付録"
    ko: "부록"
  
  # Appendix subsections
  data_sources:
    zh: "数据来源"
    en: "Data Sources"
    ja: "データソース"
    ko: "데이터 출처"
  methodology:
    zh: "研究方法"
    en: "Research Methodology"
    ja: "研究方法"
    ko: "연구 방법"
  desk_research:
    zh: "桌面研究：收集整理公开资料"
    en: "Desk Research: Collect and organize public information"
    ja: "デスクリサーチ：公開資料の収集・整理"
    ko: "데스크 리서치: 공개 정보 수집 및 정리"
  data_analysis_method:
    zh: "数据分析：运用统计方法处理数据"
    en: "Data Analysis: Apply statistical methods to process data"
    ja: "データ分析：統計手法を用いたデータ処理"
    ko: "데이터 분석: 통계적 방법 적용"
  expert_interview:
    zh: "专家访谈：补充定性洞察"
    en: "Expert Interview: Supplement qualitative insights"
    ja: "専門家インタビュー：定性的洞察の補完"
    ko: "전문가 인터뷰: 정성적 통찰 보완"
  
  # Chapter labels
  chapter:
    zh: "章节"
    en: "Chapter"
    ja: "章"
    ko: "장"
  chapter_summary:
    zh: "本章小结"
    en: "Chapter Summary"
    ja: "章のまとめ"
    ko: "장 요약"

