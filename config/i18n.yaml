# ============================================================
# Interaction Text (交互文本)
# ============================================================
interaction:
  select_output_type:
    zh: "请选择输出类型："
    en: "Please select the output type:"
    ja: "出力タイプを選択してください："
    ko: "출력 유형을 선택하세요:"
  select_framework:
    zh: "请选择研究框架："
    en: "Please select a research framework:"
    ja: "研究フレームワークを選択してください："
    ko: "연구 프레임워크를 선택하세요:"
  confirm_sections:
    zh: "请确认以下章节："
    en: "Please confirm the following sections:"
    ja: "以下の章の内容を確認してください："
    ko: "다음 장의 내용을 확인하세요:"
  confirm_parameters:
    zh: "请确认研究参数："
    en: "Please confirm research parameters:"
    ja: "研究パラメータを確認してください："
    ko: "연구 매개변수를 확인하세요:"
  confirm_start:
    zh: "确认开始研究？"
    en: "Confirm to start research?"
    ja: "研究を開始しますか？"
    ko: "연구를 시작하시겠습니까?"
  research_completed:
    zh: "研究已完成"
    en: "Research completed"
    ja: "研究完了"
    ko: "연구 완료"
  research_failed:
    zh: "研究失败"
    en: "Research failed"
    ja: "研究失敗"
    ko: "연구 실패"

  # Framework names
  framework_detailed:
    zh: "详细版"
    en: "Detailed"
    ja: "詳細版"
    ko: "상세판"
  framework_standard:
    zh: "标准版"
    en: "Standard"
    ja: "標準版"
    ko: "표준판"
  framework_brief:
    zh: "简略版"
    en: "Brief"
    ja: "簡略版"
    ko: "간략판"

# Error messages
errors:
  missing_field:
    zh: "缺少必填字段 '{field}'"
    en: "Missing required field '{field}'"
    ja: "必須フィールド '{field}' が不足しています"
    ko: "필수 필드 '{field}' 누락"
  invalid_type:
    zh: "'{field}' 必须是 {expected_type} 类型"
    en: "'{field}' must be {expected_type}"
    ja: "'{field}' は {expected_type} である必要があります"
    ko: "'{field}'은(는) {expected_type}이어야 합니다"
  no_data:
    zh: "数据不足，结论可靠性降低"
    en: "Insufficient data, conclusion reliability reduced"
    ja: "データ不足、結論の信頼性低下"
    ko: "데이터 부족, 결론 신뢰성 저하"
  timeout:
    zh: "操作超时"
    en: "Operation timeout"
    ja: "操作タイムアウト"
    ko: "작업 시간 초과"
  agent_failed:
