## 研究标准

### 数据要求
- 引用权威机构数据（SIA、WSTS、中国半导体行业协会等）
- 标注数据来源和时间
- 数据之间逻辑自洽

### 分析深度
- 不少于30,000字
- 每章不少于3,000字
- 表格数据不少于15个
- 图表不少于8个

### 报告格式
- 使用德勤风格模板
- H1=一、二、三... H2=1. 2. 3. H3=（1）（2）（3）... H4=①②③...
- 段落不少于200字
- 避免列表和要点
