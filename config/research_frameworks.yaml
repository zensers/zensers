      max_queries_per_section: 5   # Brief also needs sufficient search
      max_results_per_query: 15
      max_total_searches: 30
      priority_sources:
        - Market News
        - Data Flash Reports
        - Industry Updates
        - Latest Research Reports

    analysis:
      depth: deep                  # Brief also needs depth
      focus_areas:
        - Market Overview
        - Core Data
        - Key Trends
      metrics:
        - Market Size
        - Growth Rate
        - Major Players

    content:
      min_section_length: 800      # Brief also needs sufficient content
      require_data_points: true
      require_charts: true          # Brief also needs charts
      require_sources: true

  section_weights:
    overview: 1.5
    key_data: 2.0
    highlights: 1.2

  # === Interaction Parameter Configuration ===
  interaction_parameters:
    region:
      type: select
      label:
        zh: Region
        en: Region
      default: China
      options:
        - value: China
          label: { zh: China, en: China }
        - value: Global
          label: { zh: Global, en: Global }


# Academic Research Report Configuration (papers, literature reviews, etc.)
academic_paper:
  name: Academic Research Report
  description: Academic papers and literature reviews requiring strict citation format

  agent_config:
    search:
      max_queries_per_section: 15
      max_results_per_query: 30
      max_total_searches: 200
      priority_sources:
        - Academic Papers
        - CNKI/Wanfang
        - Google Scholar
        - Research Reports
        - Government Statistics
        - Authoritative Institutional Reports

    analysis:
      depth: ultra_deep
      focus_areas:
        - Literature Review
        - Theoretical Framework
        - Research Methodology
        - Empirical Analysis
        - Conclusions and Discussion
      metrics:
        - Sample Size
        - Significance Level
        - Confidence Interval
        - Effect Size

    content:
      min_section_length: 3000
      require_data_points: true
      require_charts: true
      require_sources: true
      require_multiple_sources: true
      require_inline_citations: true  # Academic reports need inline source citations

  section_weights:
    abstract: 0.5
    literature_review: 2.0
    methodology: 1.5
    results: 2.0
    discussion: 1.8
    conclusion: 1.2
    references: 0.5

  # === Interaction Parameter Configuration ===
  interaction_parameters: {}  # Academic reports do not need region/time parameters


# Default Configuration (used when type does not match)
