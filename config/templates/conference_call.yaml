# Conference Call Report Template
# Professional use: Meeting minutes and management commentary highlights

id: conference_call_standard
name: Conference Call Report
description: Meeting minutes and management commentary highlights, including core conclusions, key takeaways, and follow-up tracking
output_type: conference_call
estimated_pages: 5-12 pages
suitable_for:
  - Real-time Tracking
  - Management Perspectives
  - Information Flash
supported_formats:
  - docx
  - pdf
category_name: financial-analysis

sections:
  - id: meeting_info
    name: Meeting Basic Information
    required: true
    description: Time, participants, topic, moderator
    sub_sections:
      - id: meeting_details
        name: Meeting Details
        description: Date, time, format, attendees
      - id: agenda
        name: Agenda
        description: Meeting agenda and structure

  - id: core_conclusion
    name: Core Conclusions
    required: true
    description: Meeting key viewpoints, market impact assessment
    sub_sections:
      - id: key_viewpoints
        name: Key Viewpoints
        description: Top 3-5 conclusions from the call
      - id: market_impact
        name: Market Impact
        description: Expected market reaction and implications

  - id: management_speech
    name: Management Remarks Highlights
    required: true
    description: Key quotes and viewpoints from management
    sub_sections:
      - id: ceo_remarks
        name: CEO Remarks
        description: CEO commentary highlights
      - id: cfo_remarks
        name: CFO Remarks
        description: CFO financial commentary highlights

  - id: qa_highlight
    name: Q&A Highlights
    required: true
    description: Investor focus areas, management responses
    sub_sections:
      - id: investor_concerns
        name: Investor Concerns
        description: Top questions from analysts
      - id: management_responses
        name: Management Responses
        description: Key answers and clarifications

  - id: business_outlook
    name: Business Outlook Statements
    required: false
    description: Management's forward-looking statements
    sub_sections:
      - id: guidance_summary
        name: Guidance Summary
        description: Forward guidance and targets
      - id: strategic_initiatives
        name: Strategic Initiatives
        description: New initiatives and strategic direction

  - id: follow_up
    name: Follow-up Recommendations
    required: true
    description: Key metrics to monitor, verification approach
    sub_sections:
      - id: monitoring_metrics
        name: Monitoring Metrics
        description: KPIs to track going forward
      - id: verification_approach
        name: Verification Approach
        description: How to validate management claims

  - id: risks
    name: Risk Factors
    required: false
    description: Uncertainty factors
    sub_sections:
      - id: key_uncertainties
        name: Key Uncertainties
        description: Major unresolved questions
      - id: risk_monitoring
        name: Risk Monitoring
        description: Signals that could change the thesis
